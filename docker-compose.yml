services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: flowcommerce
      POSTGRES_PASSWORD: flowcommerce
      POSTGRES_DB: ${POSTGRES_DB:-flowcommerce_dev}
    volumes:
      - flowcommerce_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowcommerce -d flowcommerce']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  flowcommerce_postgres_data:
